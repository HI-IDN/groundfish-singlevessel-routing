[project]
site_name = "Groundfish Survey Routing"
site_url = "https://hi-idn.github.io/groundfish-singlevessel-routing/"
repo_url = "https://github.com/HI-IDN/groundfish-singlevessel-routing"
docs_dir = "docs"
site_dir = "site"
copyright = "© 2026 Helga Ingimundardóttir et al."
exclude_docs = "README.md"
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]
nav = [
  {"Home" = "index.md"},
  {"Paper" = [
    {"Introduction" = "02-introduction.md"},
    {"Groundfish Survey Problem" = "03-groundfish-problem.md"},
    {"Capacity-Aware MIP" = "04-capacity-aware-mip.md"},
    {"Matheuristic Framework" = "05-matheuristic.md"},
    {"Experimental Setup" = "06-experimental-setup.md"},
    {"Results" = "07-results.md"},
    {"Discussion and Conclusions" = "08-discussion-and-conclusion.md"}
  ]}
]

[project.theme]
variant = "modern"
features = [
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "search.suggest"
]

[project.markdown_extensions]
"pymdownx.snippets" = {}
"admonition" = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.arithmatex" = {generic = true}
